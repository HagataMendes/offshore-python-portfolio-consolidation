[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offshore-portfolio-backend"
version = "0.2.0"
description = "Consolidação multi-custodiante de carteiras offshore: ingestão, reconciliação, TWR e extrato."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
aws = ["boto3>=1.34"]
dev = [
  "offshore-portfolio-backend[postgres,aws]",
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "moto[s3,sqs,sns,dynamodb]>=5",
]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501"]  # notebook: imports após ajustar o sys.path; tabelas largas
